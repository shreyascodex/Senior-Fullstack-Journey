<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>
    <header>
        <h1 id="title">Survey Form</h1>
        <p id="description">Thank you for taking the time to help us improve the platform</p>
    </header>

    <main>
        <form id="survey-form">
            <label for="name" id="name-label">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email" id="email-label">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="number" id="number-label">Age</label>
            <input type="number" id="number" placeholder="Age" min="13" max="120">

            <label for="dropdown">How did you hear about us?</label>
            <select id="dropdown" name="dropdown">
                <option value="">Select an option</option>
                <option value="friend">Friend</option>

                
                <option value="social-media">Social Media</option>
                <option value="advertisement">Advertisement</option>
                <option value="other">Other</option>
            </select>

            <label>How likely are you to recommend us to a friend?</label>
            <input type="radio" name="recommend" value="definitely">Definitely
            <input type="radio" name="recommend" value="maybe">Maybe
            <input type="radio" name="recommend" value="not-sure">Not sure

            <label for="favorite">What is your favorite feature of the platform?</label>
            <select id="favorite" name="favorite">
                <option value="feature1">Feature 1</option>
                <option value="feature2">Feature 2</option>
                <option value="feature3">Feature 3</option>
            </select>

            <label>What would you like to see improved? (Check all that apply)</label>
            <input type="checkbox" name="improvements" value="front-end">
            <label>Front-end Projects</label>
            <input type="checkbox" name="improvements" value="back-end">
            <label>Back-end Projects</label>
            <input type="checkbox" name="improvements" value="data-visualization">
            <label>Data Visualization</label>
            <input type="checkbox" name="improvements" value="challenges">
            <label>Challenges</label>
            <input type="checkbox" name="improvements" value="open-source">
            <label>Open Source</label>

            <label for="comments">Any comments?</label>
            <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Enter your comments here..."></textarea>

            <button type="submit" id="submit">Submit</button>
        </form>
    </main>
</body>
</html>
